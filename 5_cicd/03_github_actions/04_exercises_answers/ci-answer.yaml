# Ответ: GitHub Actions — все упражнения
# Упражнение 01: Hello World + commit info
# Упражнение 02: Matrix (3 OS × 2 Python)
# Упражнение 03: Reusable workflow
# Упражнение 04: OIDC без статических ключей

name: Complete CI Answer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Упражнение 01: базовый job с информацией о коммите
jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show commit info
        run: |
          echo "SHA: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"
          git log --oneline -5

  # Упражнение 02: Matrix — 3 OS × 2 Python
  test-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python --version
      - run: pip install pytest
      - run: pytest tests/ -v 2>/dev/null || echo "No tests yet"

  # Упражнение 04: OIDC → AWS без статических ключей
  deploy-oidc:
    runs-on: ubuntu-latest
    needs: test-matrix
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # нужно для получения OIDC токена
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Нет access_key_id / secret_access_key!
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Verify identity
        run: aws sts get-caller-identity

      - name: Deploy
        run: |
          echo "Deploying ${{ github.sha }} to production"
          # aws eks update-kubeconfig --name prod-cluster
          # kubectl set image deployment/myapp app=$IMAGE:${{ github.sha }}
