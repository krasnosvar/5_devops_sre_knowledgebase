# Полный пример GitHub Actions: lint → test (matrix) → build → deploy
# Файл размещать: .github/workflows/ci.yaml

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ── VALIDATE ────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff mypy
      - run: ruff check .
      - run: mypy src/ --ignore-missing-imports

  # ── TEST (matrix по Python версиям) ─────────────────────────────────────────
  test:
    runs-on: ubuntu-24.04
    needs: lint
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
      fail-fast: false   # не отменять другие матрицы при падении одной

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ --cov=src --cov-report=xml -v
        env:
          DATABASE_URL: postgresql://postgres:test@localhost/testdb
      - uses: codecov/codecov-action@v4
        if: matrix.python == '3.12'   # загружать coverage только один раз

  # ── BUILD & PUSH IMAGE ───────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-24.04
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      packages: write
      contents: read
      id-token: write   # для cosign подписи

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Подписать образ через Cosign (keyless через OIDC)
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "1"

  # ── DEPLOY ───────────────────────────────────────────────────────────────────
  deploy-staging:
    runs-on: ubuntu-24.04
    needs: build
    environment: staging

    steps:
      - uses: actions/checkout@v4

      # OIDC → AWS credentials (без статических ключей)
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_ROLE_ARN }}
          aws-region: eu-central-1

      - run: aws eks update-kubeconfig --name staging-cluster
      - run: |
          kubectl set image deployment/myapp app=${{ env.IMAGE }}:${{ github.sha }} -n staging
          kubectl rollout status deployment/myapp -n staging --timeout=5m

  deploy-production:
    runs-on: ubuntu-24.04
    needs: deploy-staging
    environment: production   # требует ручного approve в GitHub UI

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: eu-central-1

      - run: aws eks update-kubeconfig --name production-cluster
      - run: |
          kubectl set image deployment/myapp app=${{ env.IMAGE }}:${{ github.sha }} -n production
          kubectl rollout status deployment/myapp -n production --timeout=10m
