---
# Ответ: идемпотентный playbook (второй запуск — только ok, нет changed)
- name: Configure web servers (idempotent)
  hosts: webservers
  become: true

  vars:
    nginx_port: 80
    app_version: "1.0.0"
    html_content: "<h1>Server: {{ inventory_hostname }}</h1>"

  tasks:
    - name: Install nginx
      ansible.builtin.package:
        name: nginx
        # идемпотентно: ставит, если нет; ничего не делает, если есть
        state: present
      notify: Reload nginx

    - name: Create web root
      ansible.builtin.file:
        path: /var/www/html
        state: directory
        mode: "0755"

    - name: Deploy index.html
      ansible.builtin.copy:
        content: "{{ html_content }}"
        dest: /var/www/html/index.html
        mode: "0644"
      # Если содержимое не изменилось — changed=false (идемпотентно)

    # Конфиг сайта — фрагмент (server {}), а не полный nginx.conf,
    # поэтому validate: "nginx -t -c %s" здесь не подходит: nginx не
    # примет server{} на верхнем уровне. Синтаксис проверяет handler.
    - name: Configure nginx site
      ansible.builtin.copy:
        content: |
          server {
              listen {{ nginx_port }};
              server_name _;
              location / {
                  root /var/www/html;
                  index index.html;
              }
              location /health {
                  return 200 "ok\n";
                  add_header Content-Type text/plain;
              }
          }
        dest: /etc/nginx/sites-available/myapp
        mode: "0644"
      notify: Reload nginx

    - name: Enable nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/myapp
        dest: /etc/nginx/sites-enabled/myapp
        state: link
      notify: Reload nginx

    - name: Disable default site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Start and enable nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Verify nginx responds
      ansible.builtin.uri:
        url: "http://localhost:{{ nginx_port }}/health"
        status_code: 200
      # uri module идемпотентен — всегда проверяет, не изменяет

  handlers:
    # Сначала проверка полного конфига, потом reload: битый конфиг
    # остановит play с ошибкой, а не уронит nginx.
    - name: Reload nginx
      ansible.builtin.command: nginx -t
      changed_when: false
      notify: Do reload nginx

    - name: Do reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

# Проверка идемпотентности (см. ansible-answers.md, упражнение 05):
# ansible-playbook -i ../02_examples/inventory.yaml site-idempotent.yaml
# 1-й запуск: несколько "changed"; 2-й запуск: changed=0
