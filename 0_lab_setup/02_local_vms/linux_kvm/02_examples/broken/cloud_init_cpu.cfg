#cloud-config
hostname: broken-cpu
manage_etc_hosts: true

users:
  - name: lab
    gecos: Lab User
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}

packages:
  - python3

write_files:
  - path: /usr/local/bin/worker.py
    permissions: "0755"
    content: |
      #!/usr/bin/env python3
      # Воркер должен раз в секунду агрегировать метрики и спать.
      # В последнем коммите разработчик забыл time.sleep() — вот и остаток бага.
      total = 0
      while True:
          total += 1

  - path: /etc/systemd/system/worker.service
    content: |
      [Unit]
      Description=Demo metrics worker
      After=network.target

      [Service]
      ExecStart=/usr/bin/python3 /usr/local/bin/worker.py
      Restart=always

      [Install]
      WantedBy=multi-user.target

runcmd:
  - systemctl daemon-reload
  - systemctl enable --now worker.service
