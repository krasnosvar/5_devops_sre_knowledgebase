#cloud-config
hostname: broken-504
manage_etc_hosts: true

users:
  - name: lab
    gecos: Lab User
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}

packages:
  - nginx
  - python3

write_files:
  - path: /usr/local/bin/backend.py
    permissions: "0755"
    content: |
      #!/usr/bin/env python3
      # Бэкенд должен отвечать на /ping мгновенно. Кто-то оставил debug-задержку,
      # эмулирующую "медленную" внешнюю зависимость (БД / другой сервис) — забыли убрать.
      import time
      from http.server import BaseHTTPRequestHandler, HTTPServer

      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              time.sleep(60)
              self.send_response(200)
              self.end_headers()
              self.wfile.write(b"pong")

      HTTPServer(("127.0.0.1", 8080), Handler).serve_forever()

  - path: /etc/systemd/system/backend.service
    content: |
      [Unit]
      Description=Demo backend for /ping
      After=network.target

      [Service]
      ExecStart=/usr/bin/python3 /usr/local/bin/backend.py
      Restart=always

      [Install]
      WantedBy=multi-user.target

  - path: /etc/nginx/sites-available/default
    content: |
      server {
        listen 80 default_server;

        location /ping {
          proxy_pass http://127.0.0.1:8080;
          proxy_read_timeout 5s;
        }
      }

runcmd:
  - systemctl daemon-reload
  - systemctl enable --now backend.service
  - systemctl restart nginx
