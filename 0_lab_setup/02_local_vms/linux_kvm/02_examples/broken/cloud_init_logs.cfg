#cloud-config
hostname: broken-logs
manage_etc_hosts: true

users:
  - name: lab
    gecos: Lab User
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}
  - name: myapp
    system: true
    shell: /usr/sbin/nologin

write_files:
  - path: /var/log/myapp.log
    owner: root:root
    permissions: "0600"
    content: ""

  - path: /usr/local/bin/myapp.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      while true; do
        echo "$(date -Is) heartbeat ok" >> /var/log/myapp.log
        sleep 5
      done

  - path: /etc/systemd/system/myapp.service
    content: |
      [Unit]
      Description=Demo app that logs a heartbeat every 5s
      After=network.target

      [Service]
      User=myapp
      ExecStart=/usr/local/bin/myapp.sh
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target

runcmd:
  - systemctl daemon-reload
  - systemctl enable --now myapp.service
