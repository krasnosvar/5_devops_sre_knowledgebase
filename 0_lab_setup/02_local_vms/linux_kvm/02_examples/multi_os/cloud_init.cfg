#cloud-config
hostname: ${hostname}
manage_etc_hosts: true

users:
  - name: lab
    gecos: Lab User
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}

package_update: true
# Только пакеты, которые есть в базовых репозиториях всех трёх дистрибутивов:
# htop на Rocky 9 лежит в EPEL, и dnf уронил бы установку всего списка.
packages:
  - curl
  - git
  - jq

runcmd:
  - echo "Lab node ${hostname} ready" > /etc/motd
