#cloud-config
hostname: ${hostname}
manage_etc_hosts: true

users:
  - name: lab
    gecos: Lab User
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}

package_update: true
packages:
  - curl
  - git
  - jq
  - htop

runcmd:
  - echo "Lab node ${hostname} ready" > /etc/motd
