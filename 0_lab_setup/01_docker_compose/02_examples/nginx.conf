# Reverse proxy для full-stack.yaml: всё, что пришло на :80, уходит в app:5000.
# Имя "app" резолвится встроенным DNS Docker (имя сервиса в compose-сети).
server {
    listen 80;

    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
