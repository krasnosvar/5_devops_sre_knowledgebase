# Упражнение 03: web поднимается всегда, Prometheus + Grafana — только
# с --profile monitoring.
services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [monitoring]
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]
