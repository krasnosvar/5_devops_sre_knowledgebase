stages: [test, build, deploy]

variables:
  IMAGE: registry.example.com/shortener:$CI_COMMIT_SHORT_SHA

test:
  stage: test
  image: python:3.13-slim
  script:
    - pip install -r app/requirements.txt fakeredis pytest httpx
    - cp 05_cicd/tests/test_app.py app/test_app.py
    - cd app && pytest -v

build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - docker build -t "$IMAGE" app/
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker push "$IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy:
  stage: deploy
  image: bitnami/kubectl:1.34
  script:
    - kubectl -n shortener set image deployment/shortener shortener="$IMAGE"
    - kubectl -n shortener rollout status deployment/shortener
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production
