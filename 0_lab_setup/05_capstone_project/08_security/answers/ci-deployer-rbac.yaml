# Минимальные права для job deploy из шага 5: только обновить образ
# Deployment и дождаться rollout в namespace shortener.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: shortener
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: shortener
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: shortener
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: shortener
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer
