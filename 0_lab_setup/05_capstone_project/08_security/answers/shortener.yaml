apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortener
  namespace: shortener
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shortener
  template:
    metadata:
      labels:
        app: shortener
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # USER в Dockerfile задан именем (appuser): kubelet не может по имени
        # проверить runAsNonRoot, поэтому UID указываем явно.
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shortener
          image: shortener:local
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: redis
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shortener
  namespace: shortener
spec:
  selector:
    app: shortener
  ports:
    - port: 8000
      targetPort: 8000
