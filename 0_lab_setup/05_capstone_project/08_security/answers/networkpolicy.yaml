# 1) по умолчанию весь ingress в namespace запрещён;
# 2) в redis можно только из подов shortener;
# 3) в shortener:8000 можно из любого источника (Service / port-forward).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: shortener
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-from-shortener
  namespace: shortener
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: shortener
      ports:
        - port: 6379
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shortener-http
  namespace: shortener
spec:
  podSelector:
    matchLabels:
      app: shortener
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8000
          protocol: TCP
