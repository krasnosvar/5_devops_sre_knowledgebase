; Заполни IP из terraform output после apply в ../02_local_vms/linux_kvm/02_examples/cluster/
[master]
k8s-master-1 ansible_host=REPLACE_ME ansible_user=lab

[workers]
k8s-worker-1 ansible_host=REPLACE_ME ansible_user=lab
k8s-worker-2 ansible_host=REPLACE_ME ansible_user=lab

[all:vars]
ansible_ssh_private_key_file=~/.ssh/lab_key
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
