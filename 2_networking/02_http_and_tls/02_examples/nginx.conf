server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    etag on;

    location / {
        # add_header работает только на СВОЁМ уровне вложенности — если этот
        # location объявит собственный add_header, он "перекроет" любые
        # add_header с уровня server (классическая ловушка nginx).
        add_header Cache-Control "max-age=3600" always;
    }
}

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}
