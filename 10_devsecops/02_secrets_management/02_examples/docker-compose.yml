services:
  vault:
    image: hashicorp/vault:latest
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-root-token"   # только для dev режима!
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    command: vault server -dev
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      retries: 10

  # Vault UI: http://localhost:8200 (token: dev-root-token)

  # Пример: приложение которое читает секреты из Vault через API
  demo-app:
    image: curlimages/curl:latest
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "dev-root-token"
    # У образа curlimages/curl ENTRYPOINT = curl, поэтому для shell-скрипта
    # переопределяем entrypoint. jq в образе нет — печатаем JSON как есть.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo '--- Записать секрет ---'
        curl -sf -X POST "$$VAULT_ADDR/v1/secret/data/myapp/config" \
          -H "X-Vault-Token: $$VAULT_TOKEN" \
          -d '{"data": {"db_password": "s3cr3t", "api_key": "abc123"}}'
        echo
        echo '--- Прочитать секрет ---'
        curl -sf "$$VAULT_ADDR/v1/secret/data/myapp/config" \
          -H "X-Vault-Token: $$VAULT_TOKEN"
        echo
    restart: "no"
