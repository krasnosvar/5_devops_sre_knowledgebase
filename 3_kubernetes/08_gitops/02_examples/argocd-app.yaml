---
# ArgoCD Application — деплоить из Kustomize overlay
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-production
  namespace: argocd
  # Finalizer — не удалять k8s ресурсы при удалении Application
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/org/gitops-config.git
    targetRevision: HEAD
    path: overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    automated:
      prune: true       # удалять ресурсы удалённые из git
      selfHeal: true    # восстанавливать при ручных изменениях
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground

---
# ApplicationSet — генерировать Application для каждого окружения
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: myapp-envs
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
            cluster: https://kubernetes.default.svc
            namespace: dev
          - env: staging
            cluster: https://kubernetes.default.svc
            namespace: staging
          - env: production
            cluster: https://kubernetes.default.svc
            namespace: production

  template:
    metadata:
      name: "myapp-{{env}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/org/gitops-config.git
        targetRevision: HEAD
        path: "overlays/{{env}}"
      destination:
        server: "{{cluster}}"
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: "{{env != 'production'}}"   # production — только manual sync
        syncOptions:
          - CreateNamespace=true

---
