---
# Ответ: ArgoCD Application с auto-sync + selfHeal
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/org/gitops-config.git
    targetRevision: HEAD
    path: overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true   # КЛЮЧЕВОЕ: восстанавливать ручные изменения
    syncOptions:
      - CreateNamespace=true

---
# Ответ: Kustomize overlays структура
#
# base/
#   kustomization.yaml:
#     apiVersion: kustomize.config.k8s.io/v1beta1
#     kind: Kustomization
#     resources:
#       - deployment.yaml
#       - service.yaml
#
# overlays/production/kustomization.yaml:
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
bases:
  - ../../base
namespace: production
replicas:
  - name: myapp
    count: 3
images:
  - name: nginx
    newTag: "1.25.3"
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"
    target:
      kind: Deployment
      name: myapp
