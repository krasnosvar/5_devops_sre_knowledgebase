all:
  children:
    webservers:
      hosts:
        web1:
          ansible_host: 192.168.200.10   # IP из KVM стенда
          ansible_user: lab
          ansible_ssh_private_key_file: ~/.ssh/lab_key
        web2:
          ansible_host: 192.168.200.11
          ansible_user: lab
          ansible_ssh_private_key_file: ~/.ssh/lab_key
      vars:
        nginx_port: 80
        app_version: "1.0.0"

    databases:
      hosts:
        db1:
          ansible_host: 192.168.200.12
          ansible_user: lab
          ansible_ssh_private_key_file: ~/.ssh/lab_key
      vars:
        postgres_version: "16"
        postgres_db: appdb

  vars:
    ansible_python_interpreter: /usr/bin/python3
