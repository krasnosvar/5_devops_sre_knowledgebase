receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

exporters:
  # Отправить traces в Jaeger по OTLP gRPC (порт 4317 внутри сети compose).
  # Старый exporter `jaeger` и порт 14250 удалены из Collector — Jaeger
  # принимает OTLP нативно.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Отдать OTLP-метрики (pipeline metrics ниже) в формате Prometheus.
  # Это не span metrics: для RED-метрик из спанов нужен connector
  # spanmetrics.
  prometheus:
    endpoint: "0.0.0.0:8889"

  # Печатать в stdout (для отладки). Exporter `logging` удалён из
  # Collector — его заменил `debug`.
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
