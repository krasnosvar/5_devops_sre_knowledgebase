services:
  # OTel Collector — принимает OTLP от приложений, отправляет traces в
  # Jaeger, а OTLP-метрики отдаёт в формате Prometheus на :8889
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "8889:8889"    # Prometheus metrics от OTel Collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      - jaeger

  # Jaeger v2 — tracing backend (сам построен на OTel Collector).
  # all-in-one режим: приём OTLP + хранение в памяти + UI.
  jaeger:
    image: jaegertracing/jaeger:latest
    ports:
      - "16686:16686"  # Jaeger UI и HTTP API (/api/services, /api/traces)
    # OTLP (4317/4318) принимается внутри сети compose от otel-collector;
    # наружу публикуем только UI. Порт 14250 (старый gRPC-протокол
    # Jaeger) в v2 не используется.

  # Grafana Tempo — альтернатива Jaeger (uncomment если нужен Tempo;
  # tempo.yaml в примерах нет — его нужно написать, и не публиковать
  # 4317 одновременно с otel-collector)
  # tempo:
  #   image: grafana/tempo:latest
  #   command: ["-config.file=/etc/tempo.yaml"]
  #   volumes:
  #     - ./tempo.yaml:/etc/tempo.yaml:ro
  #   ports:
  #     - "3200:3200"

  # Демо-приложение HotROD (Jaeger) — генерирует traces по нажатию
  # кнопок в UI: сервисы frontend, customer, driver, route, mysql, redis
  demo-app:
    image: jaegertracing/example-hotrod:latest
    command: ["all"]
    ports:
      - "8080:8080"    # UI HotROD
    environment:
      # HotROD экспортирует OTLP по HTTP (порт 4318)
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      - otel-collector
