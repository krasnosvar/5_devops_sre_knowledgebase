# LEGACY: Promtail снят с поддержки (LTS, затем EOL) — для новых установок
# используйте Grafana Alloy (alloy-config.alloy рядом делает то же самое).
# Файл оставлен для сравнения и для поддержки старых инсталляций.
# Запуск: docker compose --profile promtail up -d (без сервиса alloy).
server:
  http_listen_port: 9080

clients:
  - url: http://loki:3100/loki/api/v1/push

positions:
  filename: /tmp/positions.yaml

scrape_configs:
  # Docker контейнеры через Docker SD
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Не собирать логи самих агентов
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: 'promtail|alloy'
        action: drop
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_app]
        target_label: app
      - source_labels: [__meta_docker_container_label_environment]
        target_label: env
