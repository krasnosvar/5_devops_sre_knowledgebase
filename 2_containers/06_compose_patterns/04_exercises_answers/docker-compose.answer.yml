# Ответ: упражнение 01 — healthcheck + depends_on condition
# Ключевое: depends_on condition: service_healthy ждёт прохождения healthcheck

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    # РЕШЕНИЕ: добавить healthcheck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    image: python:3.12-slim
    command: >
      sh -c "pip install psycopg2-binary -q &&
             python -c \"
import psycopg2, time
conn = psycopg2.connect('postgresql://app:secret@db/appdb')
print('Connected to PostgreSQL!')
conn.close()
\""
    # РЕШЕНИЕ: condition: service_healthy вместо просто depends_on: db
    depends_on:
      db:
        condition: service_healthy   # ждёт pg_isready
