---
# Ответ к упражнению 02: Pod, проходящий профиль restricted.
# Требования restricted: runAsNonRoot, allowPrivilegeEscalation: false,
# drop ALL capabilities, seccompProfile RuntimeDefault (или Localhost).
# readOnlyRootFilesystem restricted не требует, но это хорошая практика.
apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: secure-test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
