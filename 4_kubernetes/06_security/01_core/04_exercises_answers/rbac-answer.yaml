---
# RBAC-объекты к упражнениям 03 и 04 (разбор команд: rbac-answers.md).

# Дополнительно (к теории §1): пользователь alice — только читать pods
# в production через namespace-Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: production
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Нельзя: delete, create, patch, exec

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alice-pod-reader-role   # другое имя, чем в 02_examples:
  namespace: production         # roleRef существующего binding менять нельзя
subjects:
  - kind: User
    name: alice
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io

---
# Ответ к упражнению 03: ServiceAccount с правами только на конкретный
# ConfigMap
apiVersion: v1
kind: ServiceAccount
metadata:
  name: myapp
  namespace: production
automountServiceAccountToken: false   # не монтировать токен глобально

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: myapp-config-reader
  namespace: production
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "watch"]
    resourceNames: ["app-config"]   # ТОЛЬКО этот конкретный ConfigMap!
    # Без resourceNames: доступны ВСЕ ConfigMaps в namespace

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: myapp-config-binding
  namespace: production
subjects:
  - kind: ServiceAccount
    name: myapp
    namespace: production
roleRef:
  kind: Role
  name: myapp-config-reader
  apiGroup: rbac.authorization.k8s.io

---
# Ответ к упражнению 04 (шаг 2): как исправить найденный небезопасный RBAC
# Проблема 1: wildcard resources/verbs/apiGroups — заменить на конкретные
# Проблема 2: ClusterRoleBinding к cluster-admin — использовать namespace Role
# Исправление:
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-role          # было: ClusterRole с wildcard
  namespace: production   # ограничить namespace, не cluster
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update"]   # конкретные verbs
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]

---
# Отдельный SA для деплой-инструмента: не смешиваем его права с myapp
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: production

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-binding
  namespace: production
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: production
roleRef:
  kind: Role              # было: ClusterRole cluster-admin
  name: app-role
  apiGroup: rbac.authorization.k8s.io

# Проверка:
#   kubectl auth can-i get pods -n production --as=system:serviceaccount:production:deployer
#   kubectl auth can-i delete pods -n production --as=system:serviceaccount:production:deployer

---
# Ответ к упражнению 03: ConfigMap, который разрешено читать
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: production
data:
  LOG_LEVEL: info

---
# Ответ к упражнению 03: тестовый Pod под ServiceAccount myapp.
# У SA выключено automountServiceAccountToken, поэтому для этого пода
# монтирование токена включаем явно (настройка пода важнее настройки SA).
apiVersion: v1
kind: Pod
metadata:
  name: test-pod
  namespace: production
spec:
  serviceAccountName: myapp
  automountServiceAccountToken: true
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["sleep", "3600"]
