---
# Validate: запретить тег :latest.
# Актуальный синтаксис ClusterPolicy (Kyverno 1.13+): режим задаётся
# в каждом правиле — validate.failureAction; старое поле
# spec.validationFailureAction устарело. match — через any/all.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        failureAction: Enforce   # Enforce — отклонить; Audit — только отчёт
        message: "Тег :latest запрещён, укажите конкретную версию образа"
        pattern:
          spec:
            containers:
              - image: "!*:latest"

---
# Mutate: дефолтные resource limits, если разработчик забыл их указать
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-default-resources
spec:
  rules:
    - name: default-resources
      match:
        any:
          - resources:
              kinds: [Pod]
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - (name): "*"
                resources:
                  +(limits):
                    memory: "256Mi"
                    cpu: "200m"
