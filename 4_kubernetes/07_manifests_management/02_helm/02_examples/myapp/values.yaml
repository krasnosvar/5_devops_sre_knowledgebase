replicaCount: 1

image:
  repository: nginx
  tag: alpine
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

ingress:
  enabled: false
  host: myapp.example.com

env: {}
  # LOG_LEVEL: info
  # ENV: production
