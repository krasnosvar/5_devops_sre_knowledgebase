---
# Ответ 01: Deployment с корректными requests + HPA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 2
  selector:
    matchLabels: {app: myapp}
  template:
    metadata:
      labels: {app: myapp}
    spec:
      containers:
        - name: myapp
          image: nginx
          resources:
            requests: {cpu: 50m}
            limits: {cpu: 100m}

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: myapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: myapp
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50

# Ответ 02: без requests.cpu HPA показывает <unknown> —
# "текущая утилизация" считается как процент от requests.cpu, а без requests
# знаменатель формулы не определён, вычислять нечего.
