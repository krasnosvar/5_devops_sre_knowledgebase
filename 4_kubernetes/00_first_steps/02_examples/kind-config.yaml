# kind: кластер из 1 control-plane ноды и 2 worker-нод.
# Каждая "нода" — это Docker-контейнер на вашей машине.
# Запуск:  kind create cluster --name first --config kind-config.yaml
# Удаление: kind delete cluster --name first
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
