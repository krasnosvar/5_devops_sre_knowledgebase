---
# Ответ к упражнению 01: Deployment с probe и rolling update
# Разбор команд: workloads-answers.md
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # zero-downtime: сначала создать новый, потом убить старый
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: nginx:1.24-alpine   # конкретный тег, не latest
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          # startupProbe: для медленного старта (не блокирует liveness)
          startupProbe:
            httpGet: {path: /, port: 80}
            failureThreshold: 30
            periodSeconds: 2
          # readinessProbe: при failure kubelet ставит поду Ready=False,
          # и EndpointSlice controller убирает его из эндпоинтов Service
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          # livenessProbe: перезапускает контейнер при зависании
          livenessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

---
# Ответ к упражнению 02: headless Service, на который ссылается
# StatefulSet через serviceName (даёт DNS-имя postgres-0.postgres-headless)
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432

---
# Ответ к упражнению 02: StatefulSet — данные сохраняются после
# пересоздания Pod
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_PASSWORD
              value: "demo"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi

---
# Ответ к упражнению 03: DaemonSet с tolerations для control-plane
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-logger
spec:
  selector:
    matchLabels:
      app: node-logger
  template:
    metadata:
      labels:
        app: node-logger
    spec:
      tolerations:
        # Запустить и на control-plane нодах
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: logger
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"$(hostname): $(date)\"; sleep 10; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 20m, memory: 32Mi}

---
# Ответ к упражнению 04: CronJob раз в минуту пишет timestamp в лог
apiVersion: batch/v1
kind: CronJob
metadata:
  name: timestamp
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid       # не запускать новый, пока идёт старый
  successfulJobsHistoryLimit: 2   # хранить только 2 успешных Job
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: date
              image: busybox:1.36
              command: ["sh", "-c", "date -u +%Y-%m-%dT%H:%M:%SZ"]

---
# Ответ к упражнению 05: Guaranteed — requests == limits для CPU и RAM
apiVersion: v1
kind: Pod
metadata:
  name: qos-guaranteed
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 50m, memory: 64Mi}

---
# Ответ к упражнению 05: Burstable — requests есть, limits выше
apiVersion: v1
kind: Pod
metadata:
  name: qos-burstable
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {memory: 32Mi}
        limits: {memory: 128Mi}

---
# Ответ к упражнению 05: BestEffort — ни requests, ни limits
apiVersion: v1
kind: Pod
metadata:
  name: qos-besteffort
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
