# Полный пример GitLab CI: lint → test → build → deploy staging → deploy production
# Подставить переменные в Settings → CI/CD → Variables:
#   CI_REGISTRY, CI_REGISTRY_USER, CI_REGISTRY_PASSWORD (автоматические)
#   STAGING_KUBECONFIG, PROD_KUBECONFIG (kubeconfig файлы в base64)

stages:
  - validate
  - test
  - build
  - deploy-staging
  - deploy-production

variables:
  DOCKER_DRIVER: overlay2
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest

default:
  interruptible: true
  retry:
    max: 1
    when: runner_system_failure

# ── VALIDATE ──────────────────────────────────────────────────────────────────
lint:
  stage: validate
  image: python:3.12-slim
  script:
    - pip install ruff mypy --quiet
    - ruff check .
    - mypy src/ --ignore-missing-imports
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

dockerfile-lint:
  stage: validate
  image: hadolint/hadolint:latest-debian
  script:
    - hadolint --failure-threshold error Dockerfile
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ── TEST ──────────────────────────────────────────────────────────────────────
unit-test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r requirements-dev.txt --quiet
    - pytest tests/unit/ -v --cov=src --cov-report=xml --tb=short
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week
  cache:
    key:
      files: [requirements-dev.txt]
    paths: [.venv/]

integration-test:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: testdb
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    DATABASE_URL: postgresql://test:test@postgres/testdb
    REDIS_URL: redis://redis:6379/0
  script:
    - pip install -r requirements-dev.txt --quiet
    - pytest tests/integration/ -v --tb=short
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── BUILD ─────────────────────────────────────────────────────────────────────
build-image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # cache-from ускоряет сборку через слои предыдущего образа
    - docker build
        --cache-from $IMAGE_LATEST
        --tag $IMAGE
        --tag $IMAGE_LATEST
        --label "git.sha=$CI_COMMIT_SHA"
        --label "git.branch=$CI_COMMIT_REF_NAME"
        .
    - docker push $IMAGE
    - docker push $IMAGE_LATEST
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ── DEPLOY STAGING ────────────────────────────────────────────────────────────
deploy-staging:
  stage: deploy-staging
  image: bitnami/kubectl:latest
  environment:
    name: staging
    url: https://staging.example.com
  before_script:
    - echo "$STAGING_KUBECONFIG" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - kubectl set image deployment/myapp app=$IMAGE -n staging
    - kubectl rollout status deployment/myapp -n staging --timeout=5m
    - kubectl rollout history deployment/myapp -n staging
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

smoke-test-staging:
  stage: deploy-staging
  image: curlimages/curl:latest
  needs: [deploy-staging]
  script:
    - sleep 10   # дать сервису стартануть
    - curl -sf https://staging.example.com/health
    - curl -sf https://staging.example.com/api/version
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ── DEPLOY PRODUCTION ─────────────────────────────────────────────────────────
deploy-production:
  stage: deploy-production
  image: bitnami/kubectl:latest
  environment:
    name: production
    url: https://example.com
  when: manual          # ручное подтверждение
  allow_failure: false
  before_script:
    - echo "$PROD_KUBECONFIG" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - kubectl set image deployment/myapp app=$IMAGE -n production
    - kubectl rollout status deployment/myapp -n production --timeout=10m
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
