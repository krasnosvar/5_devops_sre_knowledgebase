# Ответ: полный GitLab CI pipeline с lint → test → build → deploy
# Упражнение 01: базовый pipeline с 3 stages
# Упражнение 02: rules (lint+test на всём, build+deploy только на main)
# Упражнение 03: cache зависимостей
# Упражнение 04: matrix builds

stages: [validate, test, build, deploy]

# Кэш зависимостей (упражнение 03)
.python-cache: &python-cache
  cache:
    key:
      files: [requirements.txt]
      prefix: $CI_JOB_IMAGE
    paths: [.venv/]
    policy: pull-push

# Упражнение 01+02: lint
lint:
  stage: validate
  image: python:3.12-slim
  <<: *python-cache
  before_script:
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install ruff mypy --quiet
  script:
    - ruff check .
    - mypy src/ --ignore-missing-imports
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Упражнение 04: matrix builds
test:
  stage: test
  <<: *python-cache
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12"]
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install -r requirements-dev.txt --quiet
  script:
    - pytest tests/ -v --tb=short
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Упражнение 02: build только на main
build:
  stage: build
  image: docker:24
  services: [docker:24-dind]
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Упражнение 02: deploy вручную
deploy:
  stage: deploy
  image: bitnami/kubectl
  when: manual
  script:
    - kubectl set image deployment/myapp app=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - kubectl rollout status deployment/myapp --timeout=5m
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
