# Ответ: итоговый .gitlab-ci.yml после упражнений 01-04.
# Пошаговые решения и ожидаемый вывод — README.md рядом.
#
# Минимальный проект для стенда:
#   README.md
#   requirements.txt      (pytest)
#   tests/test_smoke.py   (def test_ok(): assert 1 + 1 == 2)

stages: [lint, test, build, deploy]

# Упражнение 01 + 02: lint на MR и на main
lint:
  stage: lint
  image: alpine:3.20
  script:
    - echo "Running linter..."
    - test -f README.md || (echo "README.md missing!" && exit 1)
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Упражнение 01 + 02 + 03 + 04: тесты в matrix с кэшем venv
test:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12"]
  image: python:${PYTHON_VERSION}-slim
  cache:
    key:
      files: [requirements.txt]
      # venv привязан к версии Python: без prefix три джобы matrix делили
      # бы один кэш и получали venv от чужого интерпретатора
      prefix: py${PYTHON_VERSION}
    paths: [.venv/]
  before_script:
    - python -m venv .venv
    - . .venv/bin/activate
    - pip install -r requirements.txt
  script:
    - python --version
    - pytest tests/ -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Упражнение 01 + 02: build только на main
build:
  stage: build
  image: alpine:3.20
  script:
    - echo "Building app..."
    - mkdir -p dist && echo "VERSION=1.0.0" > dist/version.txt
  artifacts:
    paths: [dist/]
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Упражнение 02: deploy только вручную на main.
# На стенде кластера нет — джоба показывает механику (manual + environment).
# Реальный деплой через kubectl — см. ../02_examples/.gitlab-ci.yml.
deploy:
  stage: deploy
  image: alpine:3.20
  script:
    - cat dist/version.txt
    - echo "Deploying $CI_COMMIT_SHORT_SHA to production"
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
