# CI-сторона GitOps: пайплайн App-репозитория собирает образ и обновляет
# тег в отдельном Ops-репозитории. В кластер CI НЕ ходит — применяет
# изменения GitOps-агент (ArgoCD/Flux), см. 4_kubernetes/09_gitops/.
#
# Структура Ops-репозитория (Kustomize overlays):
#   envs/dev/kustomization.yaml
#   envs/stage/kustomization.yaml
#   envs/prod/kustomization.yaml
#
# Переменные (Settings → CI/CD → Variables, Masked + Protected):
#   OPS_REPO_URL    — gitlab.example.com/platform/ops-repo.git (без схемы)
#   OPS_REPO_ID     — числовой ID Ops-проекта (для API merge requests)
#   OPS_REPO_TOKEN  — Project Access Token Ops-репо: роль Developer,
#                     scopes write_repository + api; только этот проект

stages: [build, update-dev, promote]

variables:
  # Неизменяемый тег: один коммит = один образ. `latest` в GitOps
  # бесполезен — Git-диффа нет, агенту нечего синхронизировать.
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

build-image:
  stage: build
  image: docker:24
  services: [docker:24-dind]
  script:
    - echo "$CI_REGISTRY_PASSWORD" |
        docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Dev обновляется автоматически: прямой коммит в envs/dev
update-dev:
  stage: update-dev
  image: alpine/k8s:1.31.0   # есть git и kustomize
  needs: [build-image]
  resource_group: ops-repo-dev   # не два пуша в Ops-репо одновременно
  script:
    - git config --global user.name "ci-bot"
    - git config --global user.email "ci-bot@example.com"
    - git clone "https://ci-bot:${OPS_REPO_TOKEN}@${OPS_REPO_URL}" ops
    - cd ops/envs/dev
    # "app" — имя образа в манифестах (images[].name в kustomization.yaml)
    - kustomize edit set image "app=${CI_REGISTRY_IMAGE}:${IMAGE_TAG}"
    - git add kustomization.yaml
    - git commit -m "dev: ${CI_PROJECT_NAME} -> ${IMAGE_TAG}"
    # Гонка: другой сервис мог запушить раньше — rebase и повтор
    - |
      for attempt in 1 2 3; do
        if git push origin HEAD:main; then exit 0; fi
        echo "push rejected, rebase (attempt ${attempt})"
        git pull --rebase origin main
      done
      echo "ERROR: не удалось запушить в Ops-репо за 3 попытки" >&2
      exit 1
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Stage/Prod — только через Merge Request в Ops-репо: ревью MR и есть
# «кнопка» аппрува, а история MR — аудит релизов.
promote-stage:
  stage: promote
  image: alpine/k8s:1.31.0
  needs: [update-dev]
  when: manual
  variables:
    BRANCH: promote/stage-${CI_PROJECT_NAME}-${CI_COMMIT_SHORT_SHA}
  script:
    - git config --global user.name "ci-bot"
    - git config --global user.email "ci-bot@example.com"
    - git clone "https://ci-bot:${OPS_REPO_TOKEN}@${OPS_REPO_URL}" ops
    - cd ops
    - git checkout -b "$BRANCH"
    - cd envs/stage
    - kustomize edit set image "app=${CI_REGISTRY_IMAGE}:${IMAGE_TAG}"
    - git add kustomization.yaml
    - git commit -m "stage: ${CI_PROJECT_NAME} -> ${IMAGE_TAG}"
    - git push origin "$BRANCH"
    - >
      curl --silent --show-error --fail
      --request POST
      --header "PRIVATE-TOKEN: ${OPS_REPO_TOKEN}"
      --data-urlencode "source_branch=${BRANCH}"
      --data-urlencode "target_branch=main"
      --data-urlencode "title=Promote ${CI_PROJECT_NAME} ${IMAGE_TAG} to stage"
      --data-urlencode "remove_source_branch=true"
      "${CI_API_V4_URL}/projects/${OPS_REPO_ID}/merge_requests"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
