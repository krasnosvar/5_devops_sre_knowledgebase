# Ответ: GitHub Actions — упражнения 01-04 в одном workflow.
# Пошаговые решения и ожидаемый вывод — README.md рядом.
# Упражнение 03 (reusable workflow) — deploy.yaml рядом.
#
# Минимальный проект: tests/test_smoke.py (def test_ok(): assert 1 + 1 == 2)

name: Complete CI Answer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# По умолчанию — только чтение; джобы расширяют права явно
permissions:
  contents: read

jobs:
  # Упражнение 01: информация о коммите
  info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # по умолчанию 1 — git log покажет один коммит
      - name: Show commit info
        run: |
          echo "SHA: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"
          git log --oneline -5

  # Упражнение 02: Matrix — 3 OS × 2 Python
  test-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python --version
      - run: python -m pip install pytest
      - run: python -m pytest tests/ -v

  # Упражнение 03: вызов reusable workflow (deploy.yaml)
  deploy-staging:
    needs: test-matrix
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: staging
      image-tag: ${{ github.sha }}
    secrets:
      KUBECONFIG: ${{ secrets.STAGING_KUBECONFIG }}

  # Упражнение 04: OIDC → AWS без статических ключей
  deploy-oidc:
    runs-on: ubuntu-latest
    needs: test-matrix
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # получить OIDC JWT от GitHub
      contents: read    # checkout (явный permissions обнуляет остальное)
    # environment меняет claim sub на repo:ORG/REPO:environment:production
    # — Trust Policy роли должна совпадать (aws-trust-policy.json)
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Нет access_key_id / secret_access_key
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Verify identity
        run: aws sts get-caller-identity
