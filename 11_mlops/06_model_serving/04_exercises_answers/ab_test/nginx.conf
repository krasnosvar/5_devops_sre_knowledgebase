# A/B: 80% запросов на v1, 20% на v2.
# Ключ разбиения — $request_id (уникален для каждого запроса).
# С ключом $remote_addr все запросы с одного хоста (curl с localhost)
# попадут в ОДНУ версию: split_clients хеширует ключ, а не считает
# запросы.
upstream model_v1 { server model-v1:3000; }
upstream model_v2 { server model-v2:3000; }

split_clients "${request_id}" $model_backend {
    80%    model_v1;
    *      model_v2;
}

server {
    listen 80;
    location /predict {
        proxy_pass http://$model_backend;
    }
}
