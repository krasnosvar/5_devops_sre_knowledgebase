# Локальный стек Личной базы документов (под Intel Core Ultra 7 155H + 64 GB RAM)
services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: vault-qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.5.12
    container_name: vault-ollama
    ports:
      - "127.0.0.1:11434:11434"
    # Жестко привязываем к 6 физическим P-ядрам Intel 155H (логические CPU 0..11)
    cpuset: "0-11"
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  vault-web:
    image: python:3.12-slim
    container_name: vault-web
    working_dir: /workspace
    command:
      - python3
      - 11_mlops/13_capstone_project/02_examples/personal_vault_app.py
      - --serve
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ../../../:/workspace:ro
    depends_on:
      - qdrant
      - ollama

volumes:
  qdrant_data:
  ollama_models:
