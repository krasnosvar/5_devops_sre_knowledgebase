services:
  # S3-совместимое хранилище для артефактов MLflow — SeaweedFS.
  # Почему не MinIO: MinIO перестал публиковать community-образы
  # (minio/minio на Docker Hub больше не скачивается). Другие варианты —
  # Garage, Ceph RGW. Без настроенных пользователей SeaweedFS ключи не
  # проверяет, поэтому AWS_* ниже фиктивные.
  s3:
    image: chrislusf/seaweedfs:4.48
    # -ip.bind=0.0.0.0: иначе S3-порт слушает только 127.0.0.1 внутри
    # контейнера и недоступен ни с хоста, ни из других сервисов
    command: server -s3 -dir=/data -ip.bind=0.0.0.0
    ports:
      - "8333:8333"   # S3 API
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      retries: 20

  # Создать bucket mlflow при старте
  s3-init:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "-c", "echo 's3.bucket.create -name mlflow' | weed shell -master=s3:9333"]
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"

  # MLflow Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://s3:8333
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    command: >
      mlflow server
        --backend-store-uri sqlite:///mlflow/mlflow.db
        --default-artifact-root s3://mlflow/
        --host 0.0.0.0
        --port 5000
    volumes:
      - mlflow_data:/mlflow
    depends_on:
      s3-init:
        condition: service_completed_successfully

  # Jupyter для интерактивного обучения моделей
  jupyter:
    # образы Jupyter Docker Stacks публикуются на quay.io (Docker Hub
    # больше не обновляется)
    image: quay.io/jupyter/scipy-notebook:latest
    ports:
      - "8888:8888"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://s3:8333
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      JUPYTER_TOKEN: "lab"
    volumes:
      - ./notebooks:/home/jovyan/work
    depends_on:
      - mlflow

# Доступ:
#   MLflow UI:     http://localhost:5000
#   S3 API:        http://localhost:8333 (ключи любые)
#   Jupyter:       http://localhost:8888 (token: lab)

volumes:
  s3_data:
  mlflow_data:
