# MLOps serving stack: vLLM + MLflow + MinIO
# Требования: NVIDIA GPU + NVIDIA Container Toolkit.
# Образ vllm/vllm-openai собран под CUDA и без GPU не работает —
# удаление GPU-настроек его в CPU-версию не превращает. Без GPU:
# запустите только minio + mlflow (docker compose up -d minio mlflow),
# а LLM поднимите через Ollama (см. ../03_exercises/README.md, упр. 01).
# BentoML-сервис для классической модели — см. упражнение 02.

services:
  # ── Model Registry ────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"   # UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
    depends_on:
      minio:
        condition: service_healthy

  # ── LLM Inference (требует GPU) ────────────────────────────────────────────
  vllm:
    image: vllm/vllm-openai:latest
    ports:
      - "8000:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    command: >
      --model Qwen/Qwen2.5-1.5B-Instruct
      --max-model-len 4096
      --gpu-memory-utilization 0.8
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  minio_data:
  hf_cache:
