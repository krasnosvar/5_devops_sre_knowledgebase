# Минимальный reverse proxy перед app для production-stack.yaml.
# HTTPS (порт 443) требует сертификатов в ./nginx/certs (они в .gitignore) —
# сгенерировать самоподписанные можно по образцу
# 2_networking/02_http_and_tls/02_examples/gen-cert.sh и добавить server
# с listen 443 ssl.
events {}

http {
    upstream app {
        server app:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
