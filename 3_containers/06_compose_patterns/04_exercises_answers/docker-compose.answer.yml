# Ответ: упражнение 01 — healthcheck + depends_on condition
# Ключевое: depends_on condition: service_healthy ждёт прохождения healthcheck

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: test
    # РЕШЕНИЕ: добавить healthcheck.
    # -h 127.0.0.1: во время первичной инициализации entrypoint postgres
    # поднимает временный сервер только на unix-сокете — pg_isready без -h
    # мог бы ответить "готов" раньше, чем откроется TCP-порт для app.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: test
    command: psql -h db -U postgres -c "SELECT 'Connected!'"
    # РЕШЕНИЕ: condition: service_healthy вместо просто depends_on: db
    depends_on:
      db:
        condition: service_healthy   # ждёт pg_isready
